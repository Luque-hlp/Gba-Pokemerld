server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  types { text/javascript js mjs; text/html html; text/css css; }
  add_header X-Content-Type-Options nosniff;
  # Nunca servir ROMs ni partidas aunque alguien las copie en la imagen
  location ~* \.(gba|agb|sav|zip)$ { return 403; }
  location / { try_files $uri $uri/ =404; }
}
